# Re-render the News list (index.html) and the LinkedIn posts (talks.html) whenever
# data/news.json or data/linkedin.json change (e.g. saved from admin.html), and once a
# month so the "New" badges age out. Commits the result; GitHub Pages then republishes.
name: Render site data
on:
  push:
    branches: [main]
    paths: ["data/**", "tools/**"]
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: site-render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render
        run: python3 tools/render.py
      - name: Commit
        run: |
          git config user.name "website-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html talks.html
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Render news / LinkedIn posts"
          git pull --rebase origin main
          git push origin HEAD:main
